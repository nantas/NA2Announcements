name: Deploy Announcement to CloudBase (Dev)

on:
  push:
    branches:
      - master

jobs:
  deploy-dev:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase (API Key, non-interactive)
        run: tcb login --cloudbase-api-key ${{ secrets.TCB_API_KEY_DEV }} -e neon-backend-dev-3fx27og6365fcc6

      - name: Strip .git before upload (avoid uploading git internals to COS)
        run: rm -rf .git

      - name: Deploy to CloudBase Static Hosting
        run: tcb hosting deploy ./ / -e neon-backend-dev-3fx27og6365fcc6 --json
